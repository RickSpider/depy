<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEPY — Documentos Electrónicos Paraguay</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ══════════════════════════════════════
       LOGIN PAGE — estilos específicos
    ══════════════════════════════════════ */
    body {
      min-height: 100vh;
      background: var(--navy);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Fondo decorativo */
    .bg-decoration {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-circle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(14,165,233,.18) 0%, transparent 70%);
    }

    .bg-circle-1 {
      width: 600px; height: 600px;
      top: -200px; right: -150px;
    }
    .bg-circle-2 {
      width: 400px; height: 400px;
      bottom: -100px; left: -100px;
      background: radial-gradient(circle, rgba(14,165,233,.10) 0%, transparent 70%);
    }
    .bg-circle-3 {
      width: 200px; height: 200px;
      top: 40%; left: 20%;
      background: radial-gradient(circle, rgba(56,189,248,.08) 0%, transparent 70%);
    }

    /* Grid lines decorativas */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(14,165,233,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(14,165,233,.04) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    /* Wrapper centrador */
    .login-wrapper {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    /* ── LOGO AREA ── */
    .login-logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
      animation: fadeSlideDown .5s cubic-bezier(.4,0,.2,1) both;
    }

    .logo-container {
      position: relative;
      width: 88px; height: 88px;
    }

    /* Anillo pulsante */
    .logo-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1.5px solid rgba(14,165,233,.3);
      animation: ringPulse 3s ease-in-out infinite;
    }
    .logo-ring-2 {
      inset: -18px;
      border-color: rgba(14,165,233,.12);
      animation-delay: .6s;
    }

    @keyframes ringPulse {
      0%, 100% { opacity: .6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    /* Logo image */
    .logo-img-wrap {
      width: 88px; height: 88px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(14,165,233,.15), rgba(14,165,233,.05));
      border: 1.5px solid rgba(14,165,233,.25);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(8px);
      cursor: default;
    }

    /* Hint de clic */
    .logo-hint { display: none; }

    /* Input file oculto */
    #logoFileInput { display: none; }

    /* Brand name */
    .login-brand {
      text-align: center;
    }
    .login-brand-name {
      font-family: 'Space Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      color: white;
      letter-spacing: -1px;
      line-height: 1;
    }
    .login-brand-name span { color: var(--sky); }
    .login-brand-sub {
      font-size: 13px;
      color: rgba(255,255,255,.35);
      margin-top: 5px;
      font-weight: 400;
      letter-spacing: .3px;
    }

    /* ── LOGIN CARD ── */
    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,.04);
      border: 1.5px solid rgba(255,255,255,.1);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      overflow: hidden;
      box-shadow:
        0 24px 60px rgba(0,0,0,.35),
        0 0 0 1px rgba(14,165,233,.08) inset;
      animation: fadeSlideUp .5s .1s cubic-bezier(.4,0,.2,1) both;
    }

    .login-card-header {
      padding: 24px 28px 20px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .login-card-title {
      font-size: 18px;
      font-weight: 700;
      color: white;
      letter-spacing: -.3px;
    }
    .login-card-sub {
      font-size: 13px;
      color: rgba(255,255,255,.4);
      margin-top: 3px;
    }

    .login-card-body { padding: 24px 28px; }

    /* Form groups */
    .login-form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 16px;
    }
    .login-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: rgba(255,255,255,.45);
    }

    .login-input-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,.06);
      border: 1.5px solid rgba(255,255,255,.1);
      border-radius: 10px;
      padding: 0 16px;
      transition: border-color .2s, background .2s, box-shadow .2s;
    }
    .login-input-wrap:focus-within {
      border-color: var(--sky);
      background: rgba(14,165,233,.07);
      box-shadow: 0 0 0 3px rgba(14,165,233,.12);
    }
    .login-input-wrap svg {
      width: 17px; height: 17px;
      color: rgba(255,255,255,.25);
      flex-shrink: 0;
      transition: color .2s;
    }
    .login-input-wrap:focus-within svg { color: var(--sky); }

    .login-input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 13px 0;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: white;
      outline: none;
    }
    .login-input::placeholder { color: rgba(255,255,255,.2); }

    /* Toggle password */
    .toggle-password {
      border: none; background: none;
      color: rgba(255,255,255,.25);
      cursor: pointer; padding: 0;
      display: flex; align-items: center;
      transition: color .2s;
    }
    .toggle-password:hover { color: rgba(255,255,255,.6); }
    .toggle-password svg { width: 17px; height: 17px; }

    /* Recordar / olvidé */
    .login-row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      margin-top: -4px;
    }
    .login-checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
      color: rgba(255,255,255,.45);
      font-weight: 500;
      user-select: none;
    }
    .login-checkbox {
      width: 16px; height: 16px;
      border-radius: 4px;
      border: 1.5px solid rgba(255,255,255,.2);
      background: transparent;
      appearance: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      transition: all .18s;
      flex-shrink: 0;
    }
    .login-checkbox:checked {
      background: var(--sky);
      border-color: var(--sky);
    }
    .login-checkbox:checked::after {
      content: '';
      position: absolute;
      width: 9px; height: 6px;
      border-left: 2px solid white;
      border-bottom: 2px solid white;
      transform: rotate(-45deg) translateY(-1px);
    }

    .forgot-link {
      font-size: 13px;
      font-weight: 600;
      color: var(--sky);
      text-decoration: none;
      transition: opacity .2s;
    }
    .forgot-link:hover { opacity: .75; }

    /* Botón login */
    .btn-login {
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: linear-gradient(135deg, var(--sky), var(--sky-dark));
      color: white; border: none;
      border-radius: 10px;
      padding: 14px 24px;
      font-size: 15px; font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer; transition: all .2s;
      box-shadow: 0 4px 20px rgba(14,165,233,.4);
      letter-spacing: .2px;
      position: relative;
      overflow: hidden;
    }
    .btn-login::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.12), transparent);
      opacity: 0;
      transition: opacity .2s;
    }
    .btn-login:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(14,165,233,.5); }
    .btn-login:hover::before { opacity: 1; }
    .btn-login:active { transform: translateY(0); }
    .btn-login svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* Loading state */
    .btn-login.loading { pointer-events: none; opacity: .8; }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
      flex-shrink: 0;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-icon-arrow { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error message */
    .login-error {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.25);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 500;
      color: #fca5a5;
    }
    .login-error.show { display: flex; }
    .login-error svg { width: 15px; height: 15px; flex-shrink: 0; color: #ef4444; }

    /* Divider */
    .login-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0;
    }
    .login-divider hr { flex: 1; border: none; border-top: 1px solid rgba(255,255,255,.08); }
    .login-divider span { font-size: 11px; color: rgba(255,255,255,.2); font-weight: 500; letter-spacing: .5px; }

    /* Footer info */
    .login-footer {
      padding: 16px 28px 22px;
      border-top: 1px solid rgba(255,255,255,.06);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .login-footer-text { font-size: 12px; color: rgba(255,255,255,.2); }
    .login-footer-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(16,185,129,.12);
      border: 1px solid rgba(16,185,129,.2);
      border-radius: 20px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 600;
      color: #34d399;
    }
    .login-footer-badge svg { width: 10px; height: 10px; }

    /* Bottom caption */
    .login-caption {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,.18);
      animation: fadeSlideUp .5s .25s cubic-bezier(.4,0,.2,1) both;
    }

    /* Animations */
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-card-header,
      .login-card-body,
      .login-footer { padding-left: 20px; padding-right: 20px; }
      .login-brand-name { font-size: 24px; }
    }
  </style>
</head>
<body>

<!-- Fondo decorativo -->
<div class="bg-decoration">
  <div class="bg-grid"></div>
  <div class="bg-circle bg-circle-1"></div>
  <div class="bg-circle bg-circle-2"></div>
  <div class="bg-circle bg-circle-3"></div>
</div>

<!-- ══════════ LOGIN WRAPPER ══════════ -->
<div class="login-wrapper">

  <!-- LOGO AREA -->
  <div class="login-logo-area">

    <div class="logo-container">
      <div class="logo-ring"></div>
      <div class="logo-ring logo-ring-2"></div>
      <div class="logo-img-wrap" style="cursor:default">
        <!-- Logo estático: ícono de factura con gradiente -->
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="56" height="56">
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#0284c7"/>
            </linearGradient>
          </defs>
          <!-- Hoja de factura -->
          <path d="M10 6C10 4.9 10.9 4 12 4H30L38 12V42C38 43.1 37.1 44 36 44H12C10.9 44 10 43.1 10 42V6Z" fill="url(#logoGrad)" opacity=".15"/>
          <path d="M10 6C10 4.9 10.9 4 12 4H30L38 12V42C38 43.1 37.1 44 36 44H12C10.9 44 10 43.1 10 42V6Z" stroke="url(#logoGrad)" stroke-width="2" fill="none"/>
          <!-- Doblez esquina -->
          <path d="M30 4L38 12H32C30.9 12 30 11.1 30 10V4Z" fill="url(#logoGrad)" opacity=".5"/>
          <!-- Líneas de texto -->
          <line x1="16" y1="20" x2="32" y2="20" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round"/>
          <line x1="16" y1="26" x2="32" y2="26" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round"/>
          <line x1="16" y1="32" x2="26" y2="32" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round"/>
          <!-- Símbolo guaraní / moneda -->
          <circle cx="33" cy="36" r="7" fill="#0c2d48" stroke="url(#logoGrad)" stroke-width="1.5"/>
          <text x="33" y="40" text-anchor="middle" font-size="9" font-weight="bold" fill="#38bdf8" font-family="monospace">₲</text>
        </svg>
      </div>
    </div>

    <div class="login-brand">
      <div class="login-brand-name">DE<span>PY</span></div>
      <div class="login-brand-sub">Documentos Electrónicos Paraguay</div>
    </div>

  </div>

  <!-- LOGIN CARD -->
  <div class="login-card">

    <div class="login-card-header">
      <div class="login-card-title">Iniciar Sesión</div>
      <div class="login-card-sub">Ingrese sus credenciales para continuar</div>
    </div>

    <div class="login-card-body">

      <!-- Error -->
      <div class="login-error" id="loginError">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="loginErrorMsg">Usuario o contraseña incorrectos.</span>
      </div>

      <!-- Usuario -->
      <div class="login-form-group">
        <label class="login-label">Usuario</label>
        <div class="login-input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input class="login-input" type="text" id="userInput"
            placeholder="usuario@empresa.com"
            autocomplete="username"
            onkeydown="if(event.key==='Enter') document.getElementById('passInput').focus()">
        </div>
      </div>

      <!-- Contraseña -->
      <div class="login-form-group">
        <label class="login-label">Contraseña</label>
        <div class="login-input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input class="login-input" type="password" id="passInput"
            placeholder="••••••••"
            autocomplete="current-password"
            onkeydown="if(event.key==='Enter') doLogin()">
          <button class="toggle-password" type="button" onclick="togglePass()" title="Mostrar/ocultar contraseña">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Recordar / Olvidé -->
      <div class="login-row-between">
        <label class="login-checkbox-label">
          <input type="checkbox" class="login-checkbox" id="rememberMe">
          Recordarme
        </label>
        <a href="#" class="forgot-link" onclick="showForgot(); return false;">¿Olvidó su contraseña?</a>
      </div>

      <!-- Botón -->
      <button class="btn-login" id="loginBtn" onclick="doLogin()">
        <div class="spinner"></div>
        <svg class="btn-icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Ingresar al sistema
      </button>

    </div>

    <!-- Footer de la card -->
    <div class="login-footer">
      <span class="login-footer-text">Conexión segura</span>
      <span class="login-footer-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        SSL
      </span>
    </div>

  </div><!-- /login-card -->

  <div class="login-caption">
    DEPY v2.0 &nbsp;·&nbsp; © 2026 &nbsp;·&nbsp; Todos los derechos reservados
  </div>

</div><!-- /login-wrapper -->

<div class="toast" id="toast"></div>

<script>
/* ── TOGGLE PASSWORD ── */
let passVisible = false;
function togglePass() {
  passVisible = !passVisible;
  const input = document.getElementById('passInput');
  input.type = passVisible ? 'text' : 'password';
  const icon = document.getElementById('eyeIcon');
  icon.innerHTML = passVisible
    ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`
    : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
}

/* ── LOGIN ── */
// Credenciales demo
const DEMO_USER = 'admin';
const DEMO_PASS = '1234';

function doLogin() {
  const user = document.getElementById('userInput').value.trim();
  const pass = document.getElementById('passInput').value;
  const btn  = document.getElementById('loginBtn');
  const err  = document.getElementById('loginError');

  // ocultar error previo
  err.classList.remove('show');

  if (!user || !pass) {
    showError('Ingrese su usuario y contraseña.');
    return;
  }

  // Simular carga
  btn.classList.add('loading');
  btn.querySelector('.btn-icon-arrow').style.display = 'none';

  setTimeout(() => {
    btn.classList.remove('loading');
    btn.querySelector('.btn-icon-arrow').style.display = '';

    if (user === DEMO_USER && pass === DEMO_PASS) {
      // Éxito → redirigir
      btn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Acceso concedido…`;
      btn.style.background = 'linear-gradient(135deg,#10b981,#059669)';
      btn.style.boxShadow  = '0 4px 20px rgba(16,185,129,.45)';
      setTimeout(() => window.location.href = 'index.html', 900);
    } else {
      showError('Usuario o contraseña incorrectos.');
      shake(document.querySelector('.login-card'));
    }
  }, 1100);
}

function showError(msg) {
  const err = document.getElementById('loginError');
  document.getElementById('loginErrorMsg').textContent = msg;
  err.classList.add('show');
}

/* Efecto shake */
function shake(el) {
  el.style.animation = 'none';
  el.style.transition = 'transform .06s';
  const moves = [6,-6,5,-5,3,-3,0];
  let i = 0;
  const interval = setInterval(() => {
    el.style.transform = `translateX(${moves[i]}px)`;
    i++;
    if (i >= moves.length) {
      clearInterval(interval);
      el.style.transform = '';
    }
  }, 55);
}

/* ── FORGOT ── */
function showForgot() {
  showToast('Función de recuperación próximamente disponible.');
}

/* ── TOAST ── */
function showToast(msg) {
  let t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ── Hint de credenciales demo ── */
window.addEventListener('DOMContentLoaded', () => {
  // Pre-fill hint subtle
  const hint = document.createElement('div');
  hint.style.cssText = `
    margin-top: 14px;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,.18);
    font-family: 'Space Mono', monospace;
  `;
  hint.innerHTML = 'Demo: <strong style="color:rgba(255,255,255,.35)">admin</strong> / <strong style="color:rgba(255,255,255,.35)">1234</strong>';
  document.querySelector('.login-card-body').appendChild(hint);
});
</script>
</body>
</html>
